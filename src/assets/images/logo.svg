<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D81B60" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
  </defs>
  <!-- Background hex-like shape but with sharp and rounded edges -->
  <path d="M 40,70 L 100,30 L 160,70 L 160,130 L 100,170 L 40,130 Z" fill="none" stroke="url(#brand-grad)" stroke-width="16" stroke-linejoin="round"/>
  <!-- stylized "A" morphing into a file -->
  <path d="M 100,60 L 60,140 H 85 L 90,125 H 125 L 140,90 Z" fill="url(#brand-grad)" />
  <path d="M 140,90 L 125,60 H 100 Z" fill="#F8BBD0" />
</svg>
